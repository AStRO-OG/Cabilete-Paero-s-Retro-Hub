<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Paero's Retro Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="webLogo">
                <img src="images/Web_logo.png" alt="Paero's Retro Hub">
            </div>
            <div class="navContainer">
                <nav class="mainNav">
                    <a href="#home">Home</a>
                    <a href="#browse">Browse Games</a>
                    <a href="#Guide">Guide & Tutorials</a>
                    <a href="#patches">Patches</a>
                    <a href="#about">About</a>
                    <a href="#contact">Contact</a>
                </nav>
            </div>
        </header>
        <main class="main">
            <div class="sect1">
                <div class="sect1_1">
                    <p>WELCOME TO</p>
                    <h2>
                        <span>PAERO'S</span>
                        <span>RETRO</span>
                        <span>HUB</span>
                    </h2>
                    <p>Discover and play retro games, homebrew projects,</p>
                    <p>patches, and guides &mdash; all in one place.</p>
                    <button>Browse Games &rarr;</button>
                </div>
                <div class="mainPictureContainer">
                    <img src="images/MainBody-Logo.png" alt="Console pictures">
                </div>
            </div>
            <div class="sect2">
                <div class="sect2_1">
                    <h2>Featured Games</h2>
                    <p>View all &rarr;</p>
                </div>
                <div class="sect2GameSlot">
                    <div class="sect2SlotImage">
                        <img src="images/Featured_Game1.jpg" alt="Pokemon Fire Red">
                        <img src="images/Featured_Game1.jpg" alt="Pokemon Fire Red">
                        <img src="images/Featured_Game1.jpg" alt="Pokemon Fire Red">
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
